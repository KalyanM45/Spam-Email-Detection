<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spam Email Detection</title>
</head>
<body>
	<h1>Spam Email Detection</h1>
	<p>Enter an email message to check whether it may be spam.</p>
	<label for="email">Email message</label>
	<textarea id="email" rows="6" cols="50" placeholder="Paste an email message here"></textarea>
	<br>
	<button type="button">Check email</button>
</body>
</html>
